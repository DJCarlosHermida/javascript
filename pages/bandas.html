<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Ingresá tu año de nacimiento y descubrí la banda que nació el mismo año que vos.">
    <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon">
    <title>|Para Fiestas| Bandas Rock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/35e1c1c54f.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bandas-page">
    <div class="body">
        <section class="section1">
            <nav class="navbar bandas-nav">
                <p class="bandas-nav__brand">DJCARLOS HERMIDA</p>
            </nav>
        </section>

        <section class="bandas-stage" id="section2">
            <div class="bandas-hero__content">
                <p class="bandas-hero__eyebrow">Archivo musical · 1949 — 2004</p>
                <h1 class="bandas-hero__title">Tu año. Tu banda.</h1>
                <p class="bandas-hero__lead">Ingresá tu año de nacimiento y descubrí la banda que nació con vos.</p>

                <form class="bandas-search" id="bandasForm" autocomplete="off">
                    <label class="visually-hidden" for="searchInput">Año de nacimiento</label>
                    <input class="bandas-search__input" type="text" id="searchInput" inputmode="numeric"
                        maxlength="4" placeholder="1949 — 2004" aria-label="Año de nacimiento entre 1949 y 2004">
                    <button class="bandas-search__btn" type="submit" id="searchButton">Buscar</button>
                </form>

                <div class="bandas-chips" id="bandasChips">
                    <button type="button" class="bandas-chip" data-query="1960">1960</button>
                    <button type="button" class="bandas-chip" data-query="1970">1970</button>
                    <button type="button" class="bandas-chip" data-query="1980">1980</button>
                    <button type="button" class="bandas-chip" data-query="1990">1990</button>
                    <button type="button" class="bandas-chip" data-query="2000">2000</button>
                </div>
            </div>

            <div class="bandas-results" id="bandasResults" aria-live="polite"></div>
        </section>

        <section class="footer bandas-footer">
            <p class="bandas-footer__text">para MGA</p>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/bandas-rock.js"></script>
    <script src="../js/script-bandas.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>
</body>
</html>
